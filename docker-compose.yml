# 可选基础设施：MySQL 8 + Qdrant。
# 本机已有 MySQL 时只需要 qdrant 服务（或直接用后端默认的 embedded 模式，无需本文件）。
#
#   docker compose up -d qdrant      # 只起向量库，后端设置 QDRANT_MODE=remote
#   docker compose up -d             # 数据库 + 向量库全量
#
# 起来后把 .env 改成：
#   DATABASE_URL=mysql+aiomysql://mentor:mentor123@127.0.0.1:3307/code_mentor?charset=utf8mb4
#   QDRANT_MODE=remote
#   QDRANT_URL=http://127.0.0.1:6333

services:
  mysql:
    image: mysql:8.0
    container_name: codementor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: code_mentor
      MYSQL_USER: mentor
      MYSQL_PASSWORD: mentor123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codementor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data: